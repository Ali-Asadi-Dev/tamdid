name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # to publish screenshots to the ci-screenshots branch
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test TamdidKit
        run: swift test --package-path Packages/TamdidKit
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(sorted(phones, key=lambda d: d["name"])[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test the app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Tamdid.xcodeproj -scheme Tamdid \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tamdid.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log | grep -E "error:|warning: .*Tamdid|Test Suite|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Tamdid.xcresult --output-path build/screenshots || true
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && success()
        working-directory: ios/build/screenshots
        run: |
          python3 - <<'PY'
          import json, os, re
          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node and "suggestedHumanReadableName" in node:
                      yield node
                  for value in node.values(): yield from walk(value)
              elif isinstance(node, list):
                  for value in node: yield from walk(value)
          for item in walk(json.load(open("manifest.json"))):
              name = re.sub(r"_\d+_[0-9A-F-]{36}", "", item["suggestedHumanReadableName"])
              if os.path.exists(item["exportedFileName"]):
                  os.rename(item["exportedFileName"], "ios-" + name)
          PY
          git init -q && git checkout -q -b ci-screenshots
          git add ios-*.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "iOS screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            ios/build/screenshots
            ios/build/xcodebuild.log
