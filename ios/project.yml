# Xcode project spec. Generate Tamdid.xcodeproj with:  brew install xcodegen && xcodegen
# The .xcodeproj is not committed: it is a build artifact of this file, so it never conflicts.
name: Tamdid
options:
  bundleIdPrefix: com.aliasadi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TamdidKit:
    path: Packages/TamdidKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Tamdid:
    type: application
    platform: iOS
    sources:
      - path: Tamdid
      - path: ../shared/catalog.json
        buildPhase: resources
    dependencies:
      - package: TamdidKit
        product: TamdidCore
      - package: TamdidKit
        product: TamdidData
    info:
      path: Tamdid/Info.plist
      properties:
        CFBundleDisplayName: Tamdid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fa, ar, tr, de]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliasadi.tamdid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  TamdidTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TamdidTests]
    dependencies:
      - target: Tamdid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  TamdidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TamdidUITests]
    dependencies:
      - target: Tamdid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tamdid

schemes:
  Tamdid:
    build:
      targets:
        Tamdid: all
        TamdidTests: [test]
        TamdidUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TamdidTests
        - TamdidUITests
